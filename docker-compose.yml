x-app: &app
  image: hangve-api-admin:local
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  init: true
  restart: unless-stopped
  volumes:
    - type: bind
      source: ${DOCKER_ENV_FILE:-./.env}
      target: /var/www/html/.env
      bind:
        create_host_path: false
    - app-storage:/var/www/html/storage
    - app-demo:/var/www/html/public/demo

services:
  app:
    <<: *app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: hangve-api-admin-nginx:local
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
      - app-demo:/var/www/html/public/demo:ro
    depends_on:
      app:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hangve_admin}
      MYSQL_USER: ${DB_USERNAME:-hangve}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the Docker environment file}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the Docker environment file}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue:
    <<: *app
    profiles: ["queue"]
    command: ["php", "artisan", "queue:work", "redis", "--queue=${DOCKER_QUEUES:-default,sent-noti-admin}", "--sleep=3", "--tries=3", "--timeout=60"]
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 90s

  scheduler:
    <<: *app
    profiles: ["scheduler"]
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  app-storage:
  app-demo:
